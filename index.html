 slowly... I can almost imagine.","Please. I will pay you. Just eat one in front of me. Take your time. Look me in the eyes.","I am not weird about it."],dialog_complete:["Thank you.","That was everything."],hp:30,atk:12},{id:"dr_coconut",name:"Dr. Coconut",emoji:"\u{1F9D1}\u200D\u2695\uFE0F",x:4,y:5,isDoctor:!0,dialog:["Hey there. Name is Dr. Coconut.","Been on this island a long time. Just me and the coconuts.","They are good for you. Very good. I would know.","I can patch you up if you need it. Costs a few bananas."]},{id:"darwin",name:"Charles Darwin",emoji:"\u{1F9D1}\u200D\u{1F52C}",x:35,y:32,isDarwin:!0,dialog:["Fascinating.","Absolutely fascinating.","I have been observing you monkeys for some time now.","The behavioral patterns. The banana economy. The ghost. Remarkable.","I have developed something. A vial. It will temporarily accelerate your evolution.","You will become human. Just for a minute. See how it feels."]},{id:"wizard",name:"The Wizard",emoji:"\u{1F9D9}",x:25,y:32,isWizard:!0,dialog:["Ah. A visitor.","I have been waiting in these plains for a long time.","The ghost monkey to the north... he is trapped. He cannot move on.","I can free him. But I need three things.","Bring me a spirit candle from the dark forest. A skull from the depths of hell. And the ancient relic buried somewhere in these very plains.","Find them. Bring them here. Then we shall see."]}],Do=[{id:"two_headed",desc:"Find the mirror hidden in the forest to the south.",reward:30,karma:15,takeItem:"mirror"},{id:"red_monkey",desc:"Bring Mr. Red a coconut from the island.",reward:25,karma:15,takeItem:"coconut"},{id:"big_monkey",desc:"Bring Big Monkey the small thing he refuses to name.",reward:80,karma:15,takeItem:"teddy"},{id:"ghost_monkey",desc:"Eat a banana in front of him. Slowly. (costs 1 banana)",reward:50,karma:15,takeBananas:1,turnInLabel:"Eat banana in front of him"}],R2=[{id:"angel_wise",name:"Angel",emoji:"\u{1F47C}",x:11,y:32,dialog:["Peace, little monkey.","You lived with
