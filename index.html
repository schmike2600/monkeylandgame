<title>Monkeyland</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One look: a bright island game. Light only, set deliberately. */
:root {
  --bg: #fbf7ea; --fg: #1c1a14;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --color-text-primary: #1c1a14; --color-text-secondary: #6b6757;
  --color-border-tertiary: rgba(28,26,20,.18); --color-border-secondary: rgba(28,26,20,.35);
  --color-background-secondary: #f1ecda;
  color-scheme: light;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
#wrap { max-width: 100%; overflow-x: auto; }
button { font-family: inherit; }
</style>

 skates. I don't need them. I fall down in them."],_s=["*sniff* ...thank you.","That helped. A little.","I just needed someone to stay for a second.","You smell like bananas. It's nice.","Okay. Okay, I'm okay. ...Could I have another one?","*sniff* You're very warm.","I don't know why I'm like this. Thank you for not asking."],Zh=[{id:"sad_sammy",name:"Sad Sammy",emoji:"\u{1F61E}",x:11,y:18,isSammy:!0,dialog:["...oh. Hi.","Sorry. I'm fine. I'm just a little... teary.","Could I ask you something? It's silly.","Could I have a hug?"]},{id:"two_headed",name:"Two-Headed Monkey",emoji:"\u{1F412}",x:19,y:2,dialog:["We agree on nothing.","EVERYTHING!","...nothing."],dialog_hasitem:["IS THAT A MIRROR?!","GIVE IT.","no YOU give it."],dialog_complete:["I look incredible.","NO I look incredible.","...","...","We both look incredible."],hp:40,atk:8},{id:"red_monkey",name:"Mr. Red",emoji:"\u{1F435}",x:16,y:7,dialog:["You got a problem?","Thought not."],dialog_hasitem:["...is that a coconut.","Give it here.","Do not say anything.","And take this map. It is not red. I do not want it."],dialog_complete:["...good.","Now get out of my sight.","Use the map. Stop asking me where things are."],hp:320,atk:28},{id:"big_monkey",name:"Big Monkey",emoji:"\u{1F98D}",x:30,y:4,dialog:["...","You are still here.","Fine. There is a thing. A small thing. Do not make it weird.","Bring it to me and I will not destroy you. That is the deal.","It is for reasons. Do not ask."],dialog_hasitem:["...","...is that what I think it is.","Give it here.","Do not tell anyone about this."],dialog_complete:["You did not see anything.","That never happened.","Go."],hp:200,atk:22},{id:"ghost_monkey",name:"Monkey Ghost",emoji:"\u{1F47B}",x:34,y:9,dialog:["OooOOOooo...","Every banana I try to eat goes right through me. I cannot feel it. I cannot taste it. I am cursed.","But if I watch someone else eat one... slowly... I can almost imagine.","Please. I will pay you. Just eat one in front of me. Take your time. Look me in the eyes.","I am not weird about it."],dialog_complete:["Thank you.","That was everything."],hp:30,atk:12},{id:"dr_coconut",name:"Dr. Coconut",emoji:"\u{1F9D1}\u200D\u2695\uFE0F",x:4,y:5,isDoctor:!0,dialog:["Hey there. Name is Dr. Coconut.","Been on this island a long time. Just me and the coconuts.","They are good for you. Very good. I would know.","I can patch you up if you need it. Costs a few bananas."]},{id:"darwin",name:"Charles Darwin",emoji:"\u{1F9D1}\u200D\u{1F52C}",x:35,y:32,isDarwin:!0,dialog:["Fascinating.","Absolutely fascinating.","I have been observing you monkeys for some time now.","The behavioral patterns. The banana economy. The ghost. Remarkable.","I have developed something. A vial. It will temporarily accelerate your evolution.","You will become human. Just for a minute. See how it feels."]},{id:"wizard",name:"The Wizard",emoji:"\u{1F9D9}",x:25,y:32,isWizard:!0,dialog:["Ah. A visitor.","I have been waiting in these plains for a long time.","The ghost monkey to the north... he is trapped. He cannot move on.","I can free him. But I need three things.","Bring me a spirit candle from the dark forest. A skull from the depths of hell. And the ancient relic buried somewhere in these very plains.","Find them. Bring them here. Then we shall see."]}],Cs=[{id:"two_headed",desc:"Find the mirror hidden in the forest to the south.",reward:30,karma:15,takeItem:"mirror"},{id:"red_monkey",desc:"Bring Mr. Red a coconut from the island.",reward:25,karma:15,takeItem:"coconut",giveItem:"map"},{id:"big_monkey",desc:"Bring Big Monkey the small thing he refuses to name.",reward:80,karma:15,takeItem:"teddy"},{id:"sad_sammy",desc:"Bring Sad Sammy a gold star. He'll trade you his old roller skates. (costs 1 star)",reward:0,karma:0,takeStars:1,giveItem:"roller_skates",needKarma:50,turnInLabel:"Give him a star"},{id:"ghost_monkey",desc:"Eat a banana in front of him. Slowly. (costs 1 banana)",reward:50,karma:15,takeBananas:1,turnInLabel:"Eat banana in front of him",instant:!0}],Eb=[{id:"angel_wise",name:"Angel",emoji:"\u{1F47C}",x:11,y:32,dialog:["Peace, little monkey.","You lived with kindness. The bananas here never run out. You earned them.","Rest now. You are home."]},{id:"angel_petty_fire",name:"Angel",emoji:"\u{1F47C}",x:19,y:35,dialog:["Oh. You made it. Interesting.","I saw the campfire incident by the way. Just standing in it. For how long exactly?","Anyway. Welcome to heaven. Not that you would know what that looks like.","I am not judging. This is literally my job. I am just noting things."]},{id:"angel_petty_battle",name:"Angel",emoji:"\u{1F47C}",x:19,y:35,dialog:["Oh. You made it. Interesting.","You picked a fight and lost. I hope you understand how unsurprising that is.","Anyway. Welcome to heaven. Not that you would know what that looks like.","I am not judging. This is literally my job. I am just noting things."]},{id:"angel_weird",name:"Angel",emoji:"\u{1F47C}",x:15,y:29,dialog:["The banana was never yours.","It was always the banana.","You were simply the direction it was traveling.","Sleep well."]},{id:"ghost_heaven",name:"Monkey Ghost",emoji:"\u{1F47B}",x:15,y:34,dialog:["...you came.","I did not think anyone would.","I can eat bananas now. I ate seventeen of them.","Thank you. I mean it.","And I guess... since you saved a soul, your soul was returned to you.","Rest well, little monkey."]},{id:"saint_pete",name:"Saint Pete",emoji:"\u{1F9D3}",x:15,y:21,isGatekeeper:!0,dialog:["Name?","...Do not tell me. I have a list. Monkeys are filed under B, for Banana.","Ah. There you are. Karma checks out. Not stellar. Acceptable.","Your bananas stay behind. Appetite does not come upstairs. Your belongings are your own, though. You earned those.","Two doors. Up, through the gate, to the Upper Clouds, where the good stuff is. Or back down to earth, where you can go on being a monkey.","Both are free. Going down, you land at half health, so mind that. The gift shop is upstairs. Mikey runs it."]},{id:"mikey",name:"Mikey",emoji:"\u{1F47C}",x:21,y:6,isHeavenVendor:!0,dialog:["Wassssaaaaaaaahhh, dude?","Name's Mikey. Welcome to the good part of heaven.","I got halos and swords, dude. Stars only, no bananas. I've got a whole grove of those, they're everywhere.","Stars are just chillin' on the ground up here. Grab some, we got all of eternity."]},{id:"angel_hr",name:"Angel",emoji:"\u{1F47C}",x:8,y:12,dialog:["Hm? Oh, you are staring, dear one.","Let me guess. I look like a person. Wings, halo, the whole human arrangement.","I am a monkey. A monkey angel. Everyone up here is a monkey.","Pete. The harp section. Mikey, bless him. All monkeys.","If some of us look human to you, that is a you thing. Look again.","...There. Still a monkey. Do not touch the clouds, by the way. They are load bearing."]},{id:"angel_choir",name:"Angel",emoji:"\u{1F47C}",x:23,y:13,music:!0,dialog:["We are rehearsing.","We have been rehearsing for four thousand years.","The song is one note. We are still not ready."]},{id:"angel_harp1",name:"Harp Angel",emoji:"\u{1F47C}",x:21,y:12,music:!0,dialog:["*plink*","Sorry. I am not allowed to stop. If I stop the harp, the whole section notices.","*plink*"]},{id:"angel_harp2",name:"Harp Angel",emoji:"\u{1F47C}",x:25,y:12,music:!0,dialog:["Shh. This is the good part.","...It is always the good part.","*plink plonk*"]}],Tb={id:"leprechaun",name:"Leprechaun",emoji:"\u{1F9DD}",x:4,y:10,isLeprechaun:!0,dialog:["Well, well. Ye walked the whole rainbow. Nobody walks the whole rainbow.","The pot is mine. The gold is mine. But I am a sporting fella.","Put some stars on a coin flip. Win three in a row and the pot opens. Lose once and ye start over.","Fair warning: the coin and I have an understanding."]},Ab=[...Eb.map(t=>({...t,x:t.x+ea})),Tb],_b=[{id:"meph",name:"Mephistopheles",emoji:"\u{1F608}",x:5,y:9,isMeph:!0,dialog:["...well well well.","You found your way down here. Interesting.","Keep everything you carried down. Bananas included. Business needs customers with something to spend."," @keyframes mlBubble { 0%, 100% { opacity: 0; transform: translateY(2px) scale(.7); } 50% { opacity: 1; transform: translateY(-3px) scale(1); } }
@keyframes mlWave { 0%, 100% { opacity: 0; transform: translateY(2px) scale(.85); } 50% { opacity: .6; transform: translateY(-2px) scale(1); } }
@keyframes mlAxeSwing {
  0%   { transform: rotate(-95deg) scaleX(-1); opacity: 0; }
  15%  { transform: rotate(-95deg) scaleX(-1); opacity: 1; }
  55%  { transform: rotate(35deg) scaleX(-1); }
  70%  { transform: rotate(25deg) scaleX(-1); }
  100% { transform: rotate(-20deg) scaleX(-1); opacity: 0; }
}
@keyframes mlCrystal {
  0%   { transform: translateY(10px) scale(.3); opacity: 0; }
  25%  { transform: translateY(-24px) scale(1.15); opacity: 1; }
  45%  { transform: translateY(-28px) scale(1); opacity: 1; }
  65%  { transform: translateY(-24px) scale(1.2); opacity: 1; }
  85%  { transform: translateY(-28px) scale(1.05); opacity: 1; }
  100% { transform: translateY(-34px) scale(1.4); opacity: 0; }
}
@keyframes mlSpark {
  0%   { transform: translate(0, 0) scale(.3) rotate(0deg); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity: 0; }
}
@keyframes mlClover {
  0%   { transform: translate(0, 0) scale(.5) rotate(0deg); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translate(var(--dx), -22px) scale(1) rotate(var(--rot)); opacity: 0; }
}
@keyframes mlCurse {
  0%   { transform: translate(0, 0) scale(.5) rotate(0deg); opacity: 0; }
  25%  { opacity: .95; }
  100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .mlfx { display: none; } }
@keyframes mlShovelDig {
  0%   { transform: translateY(-10px) rotate(20deg); opacity: 0; }
  15%  { transform: translateY(-10px) rotate(20deg); opacity: 1; }
  40%  { transform: translateY(6px) rotate(20deg); }
  55%  { transform: translateY(-4px) rotate(20deg); }

  100% { transform: translateY(8px) rotate(20deg); opacity: 0; }
